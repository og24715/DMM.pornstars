name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Create zip
        run: npm run zip

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: |
            chrome.zip
            chrome/dist

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension zip
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # The release job has no checkout, so gh cannot infer the repo
          # from a local git remote; tell it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" chrome.zip --clobber \
          || gh release create "${GITHUB_REF_NAME}" chrome.zip --title "${GITHUB_REF_NAME}"
